<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0}:root{color-scheme:light}[hidden]{display:none!important}</style>
<title>Disease Prediction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: split sign-in with an ECG motif; after sign-in a top bar with tabs and one content column that reads like a clinical chart sheet. */
:root{
  --bg:#EDF1EF; --surface:#F9FBFA; --ink:#12272B; --muted:#4F6468; --line:#C9D5D2;
  --accent:#0B6B66; --accent-ink:#FFFFFF; --accent-soft:#D4EAE6;
  --brand:#0A3F3D; --brand-ink:#E4F3F0; --brand-line:#5FD0C4;
  --ok:#276C45; --ok-soft:#D8EEDF; --warn:#8F5600; --warn-soft:#FAE9C8; --crit:#A8231B; --crit-soft:#F8D9D5;
  --f-display:'Bricolage Grotesque','Noto Sans Tamil',system-ui,sans-serif;
  --f-body:'Instrument Sans','Noto Sans Tamil',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1819; --surface:#112527; --ink:#E2EFED; --muted:#9BB2AF; --line:#254240;
    --accent:#55C7BB; --accent-ink:#04201D; --accent-soft:#153A3A;
    --brand:#0A2E2D; --brand-ink:#E0F1EE; --brand-line:#5FD0C4;
    --ok:#7BD39B; --ok-soft:#14301F; --warn:#F2BC5E; --warn-soft:#38290C; --crit:#FF9A90; --crit-soft:#3E1714;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1819; --surface:#112527; --ink:#E2EFED; --muted:#9BB2AF; --line:#254240;
  --accent:#55C7BB; --accent-ink:#04201D; --accent-soft:#153A3A;
  --brand:#0A2E2D; --brand-ink:#E0F1EE; --brand-line:#5FD0C4;
  --ok:#7BD39B; --ok-soft:#14301F; --warn:#F2BC5E; --warn-soft:#38290C; --crit:#FF9A90; --crit-soft:#3E1714;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{font-weight:600;padding:.7em 1.25em;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:36px;padding:.4em .9em;font-size:.9rem}
.btn.block{width:100%}
.btn.danger{border-color:var(--crit);color:var(--crit);background:transparent}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label,.lbl{font-weight:600;font-size:.88rem}
input[type=text],input[type=email],input[type=password],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.65em .8em;min-height:44px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
.err{color:var(--crit);min-height:1.4em;font-size:.9rem;margin:0 0 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* auth */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.auth-brand{background:var(--brand);color:var(--brand-ink);padding-block:48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-width:0}
.brand-mark{font-family:var(--f-display);font-weight:700;font-size:1.6rem;display:flex;align-items:baseline;gap:10px}
.brand-mark small{font-family:var(--f-body);font-weight:400;font-size:.95rem;opacity:.8}
.ecg{width:100%;height:auto;color:var(--brand-line);display:block}
.ecg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ecg path{animation:none;stroke-dashoffset:0}}
.auth-brand h1{max-width:16ch;margin-bottom:14px}
.auth-brand p{opacity:.88;max-width:44ch}
.feat{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:8px;font-size:.95rem}
.feat li{display:flex;gap:10px;align-items:baseline}
.feat li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand-line);flex:none;transform:translateY(-1px)}
.auth-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.auth-card{width:100%;max-width:400px}
.auth-card h2{margin-bottom:6px}
.auth-card .muted{margin-bottom:22px}
.switch{margin-top:14px;text-align:center}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fine{margin-top:16px;font-size:.8rem;color:var(--muted)}
@media (max-width:820px){
  .auth{grid-template-columns:1fr}
  .auth-brand{padding-block:28px;gap:18px}
  .feat{display:none}
}

/* shell */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top-in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:16px;color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;max-width:100%}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:.55em .8em;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tab[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.who{display:flex;align-items:center;gap:12px;font-size:.9rem}
.wrap{max-width:1040px;margin:0 auto;padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.panel + .panel{margin-top:16px}
.panel h3{margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.cols .panel + .panel{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:1.8rem;font-weight:500;line-height:1.1}
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:.15em .65em;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.crit{color:var(--crit)}
.tip{border-left:3px solid var(--accent);padding-left:12px}

/* stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;font-size:.85rem}
.steps span{padding:.3em .8em;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span[aria-current=step]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.steps span.done{color:var(--ink)}

/* chips */
.group{margin-top:18px}
.group h3{font-size:.82rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5em .95em;border-radius:999px;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip[aria-pressed=true]::before{content:"\2713\00a0"}
.bar-actions{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:.55em 1em;cursor:pointer;min-height:42px}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent)}
.opt{margin-bottom:20px}
.opt > .lbl{display:block;margin-bottom:8px}

/* result */
.banner{display:flex;gap:14px;align-items:flex-start;border-radius:10px;padding:16px 18px;border:1px solid currentColor}
.banner .ic{flex:none;width:30px;height:30px;border-radius:50%;background:currentColor;display:grid;place-items:center}
.banner .ic span{color:var(--surface);font-weight:700;font-family:var(--f-mono)}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner .bt{color:var(--ink)}
.banner .bt b{display:block;font-size:1.05rem;color:inherit}
.banner.crit .bt b{color:var(--crit)}.banner.warn .bt b{color:var(--warn)}.banner.ok .bt b{color:var(--ok)}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;margin-bottom:14px}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.9rem;color:var(--muted)}
.top-match{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.big{font-family:var(--f-mono);font-size:3.2rem;font-weight:500;line-height:1;color:var(--accent)}
.big small{font-size:1.4rem}
@media (max-width:520px){.top-match{grid-template-columns:1fr}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.82rem;padding:.2em .7em;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.tag.miss{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.list{margin:8px 0 0;padding-left:1.2em;display:grid;gap:5px}
.sub{margin-top:18px}
.sub > .lbl{display:block;margin-bottom:6px}
.rank{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 3.2em;gap:10px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rank .pc{font-family:var(--f-mono);text-align:right}
@media (max-width:520px){.rank{grid-template-columns:1fr 3em}.rank .bar{grid-column:1 / -1;order:3}}
.disclaimer{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
textarea.copybox{width:100%;min-height:160px;font-family:var(--f-mono);font-size:.82rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px}

/* tools */
.out{margin-top:12px;border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--bg)}
.out.ok{background:var(--ok-soft);border-color:var(--ok)}
.out.warn{background:var(--warn-soft);border-color:var(--warn)}
.out.crit{background:var(--crit-soft);border-color:var(--crit)}
.out b{display:block}
.out .v{font-family:var(--f-mono);font-size:1.5rem}

/* history */
.hist{display:grid;gap:12px}
.hist-item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:center}
.hist-item .meta{min-width:0}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
/* dashboard illustrations */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:18px}
.hero-text{display:flex;flex-direction:column;gap:12px;min-width:0;align-items:flex-start}
.hero-art{width:100%;max-width:300px;height:auto;justify-self:center}
.a-soft{fill:var(--accent-soft)}.a-surf{fill:var(--surface)}.a-acc{fill:var(--accent)}.a-line{fill:var(--line)}.a-crit{fill:var(--crit)}.a-ink{fill:var(--accent-ink)}.s-acc{stroke:var(--accent)}
.hero-art .nofill{fill:none}
@media (max-width:720px){.hero{grid-template-columns:1fr;padding:18px}.hero-art{max-width:220px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:500;line-height:1.2}
.sec{margin:26px 0 12px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.area{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--ink);cursor:pointer;min-width:0}
.area:hover{border-color:var(--accent)}
.area b{display:block}
.area-ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ico{width:26px;height:26px}
.auth-brand .hero-art{max-width:240px;justify-self:start}
.auth-brand .ecg{margin-top:12px}
@media (max-width:820px){.auth-brand .hero-art{display:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6em 1.1em;border-radius:8px;z-index:20;max-width:90vw}
</style>

</head>

];

function toC(t){if(isNaN(t))return null;return t>45?Math.round(((t-32)*5/9)*10)/10:t;}
function boost(d,P,c,age,bmi){
  var b=0,cond=P.cond||[];
  if(c.mosquito&&['dengue','malaria','chik'].indexOf(d.id)>-1)b+=.07;
  if(c.water&&['typhoid','gastro','jaundice'].indexOf(d.id)>-1)b+=.07;
  if(c.contact&&['cold','flu','covid'].indexOf(d.id)>-1)b+=.06;
  if(c.dust&&['allergy','asthma'].indexOf(d.id)>-1)b+=.07;
  if(d.id==='diabetes'&&(cond.indexOf('diabetes')>-1||bmi>=25))b+=.06;
  if(d.id==='bp'&&(cond.indexOf('bp')>-1||bmi>=25))b+=.06;
  if(d.id==='asthma'&&cond.indexOf('asthma')>-1)b+=.1;
  if(age>=60&&['pneumonia','flu','covid'].indexOf(d.id)>-1)b+=.05;
  if(P.smoker&&['pneumonia','asthma'].indexOf(d.id)>-1)b+=.03;
  if(P.sex==='female'&&['anemia','uti'].indexOf(d.id)>-1)b+=.04;
  return b;
}
function bmiCalc(h,w){
  h=parseFloat(h);w=parseFloat(w);
  if(!(h>0)||!(w>0))return null;
  var v=w/Math.pow(h/100,2),cat,tone;
  if(v<18.5){cat='Underweight';tone='warn';}
  else if(v<25){cat='Healthy weight';tone='ok';}
  else if(v<30){cat='Overweight';tone='warn';}
  else{cat='Obese range';tone='crit';}
  var lo=18.5*Math.pow(h/100,2),hi=24.9*Math.pow(h/100,2);
  return {v:Math.round(v*10)/10,cat:cat,tone:tone,lo:Math.round(lo),hi:Math.round(hi),south:(v>=23&&v<25)};
}
function analyze(){
  var u=U(),P=u.profile||{},set=new Set(S.sel);
  var tc=toC(parseFloat(S.temp));
  if(tc!==null&&tc>=37.8)set.add('fever');
  var age=parseFloat(P.age)||0,b=bmiCalc(P.height,P.weight),bmi=b?b.v:0;
  var damp=Math.min(1,.7+.1*set.size);
  var ranked=D.map(function(d){
    var keys=Object.keys(d.sym);
    var total=keys.reduce(function(a,k){return a+d.sym[k];},0);
    var matched=keys.filter(function(k){return set.has(k);});
    if(!matched.length)return {id:d.id,pct:0,matched:[]};
    var mw=matched.reduce(function(a,k){return a+d.sym[k];},0);
    var cov=mw/total,prec=matched.length/set.size;
    var core=keys.filter(function(k){return d.sym[k]>=3;});
    var coreHit=core.length?core.filter(function(k){return set.has(k);}).length/core.length:0;
    var s=(.5*cov+.3*prec+.2*coreHit)*damp;
    s+=boost(d,P,S.ctx,age,bmi);
    s+=(S.dur>=d.dur[0]&&S.dur<=d.dur[1])?.03:-.05;
    s=Math.max(0,Math.min(.96,s));
    return {id:d.id,pct:Math.round(s*100),matched:matched};
  }).filter(function(r){return r.pct>0;}).sort(function(a,b){return b.pct-a.pct;});

  var flags=[],reasons=[];
  if(set.has('chest_pain')&&set.has('short_breath'))flags.push('Chest pain with breathlessness can point to a heart or lung emergency.');
  if(set.has('short_breath')&&S.sev==='severe')flags.push('Severe difficulty in breathing needs immediate care.');
  if(set.has('bleeding_gums')&&set.has('fever')&&(set.has('vomiting')||set.has('abd_pain')))flags.push('Fever with bleeding and vomiting or stomach pain are dengue warning signs.');
  var level='home';
  if(flags.length){level='emergency';}
  else{
    if(S.sev==='severe')reasons.push('You rated your symptoms as severe.');
    if(tc!==null&&tc>=39.5)reasons.push('Your temperature is above 39.5 °C.');
    if(S.dur>=10&&set.has('fever'))reasons.push('Fever that lasts more than a week needs a check.');
    if(set.has('yellow'))reasons.push('Yellow skin or eyes need a blood test.');
    if(ranked.length&&SERIOUS.indexOf(ranked[0].id)>-1&&ranked[0].pct>=50)reasons.push('The top match is a condition that needs a medical test.');
    if(reasons.length)level='soon';
  }
  return {id:Date.now().toString(36),ts:Date.now(),sel:Array.from(set),dur:S.dur,sev:S.sev,temp:tc,ctx:Object.assign({},S.ctx),
    level:level,flags:flags,reasons:reasons,ranked:ranked.slice(0,6),age:age||null,bmi:bmi||null};
}

  if(S.step===3&&S.cur)return resultView(S.cur);
  var steps='<div class="steps" aria-label="Progress"><span'+(S.step===1?' aria-current="step"':' class="done"')+'>1 Symptoms</span><span'+(S.step===2?' aria-current="step"':'')+'>2 Details</span><span>3 Report</span></div>';
  if(S.step===1){
    return '<div class="page-head"><span class="eyebrow">Symptom check</span><h1>Which symptoms do you have?</h1><p class="muted">Select everything that applies. Pick at least two.</p></div>'+steps+
    '<div class="panel"><div class="field" style="margin-bottom:0"><label for="q">Search symptoms</label><input id="q" type="text" placeholder="For example cough" value="'+esc(S.q)+'" autocomplete="off"></div><div id="chips">'+chipsHTML()+'</div>'+
    '<div class="bar-actions"><div><b id="selcount">'+S.sel.size+'</b> selected <button class="link" data-act="clear-sel" style="margin-left:8px">Clear</button></div><button id="nextbtn" class="btn" data-act="next"'+(S.sel.size<2?' disabled':'')+'>Next: details</button></div></div>';
  }
  var P=U().profile||{};
  return '<div class="page-head"><span class="eyebrow">Symptom check</span><h1>A few more details</h1><p class="muted">These change how likely each condition is and how urgent it looks.</p></div>'+steps+
  '<div class="panel">'+
  '<div class="opt"><span class="lbl">How long have you had these symptoms?</span><div class="seg">'+DURS.map(function(d){return '<button data-act="dur" data-v="'+d[0]+'" aria-pressed="'+(S.dur===d[0])+'">'+d[1]+'</button>';}).join('')+'</div></div>'+
  '<div class="opt"><span class="lbl">How severe are they?</span><div class="seg">'+SEVS.map(function(d){return '<button data-act="sev" data-v="'+d[0]+'" aria-pressed="'+(S.sev===d[0])+'">'+d[1]+'</button>';}).join('')+'</div></div>'+
  '<div class="opt field" style="max-width:260px"><label for="temp">Body temperature (optional)</label><input id="temp" type="number" step="0.1" min="30" max="115" placeholder="For example 38.5" value="'+esc(S.temp)+'"><span class="muted" style="font-size:.82rem">In °C. A value above 45 is read as °F.</span></div>'+
  '<div class="opt"><span class="lbl">Does any of this apply?</span><div class="checks">'+CTX.map(function(c){return '<label class="check"><input type="checkbox" data-ctx="'+c[0]+'"'+(S.ctx[c[0]]?' checked':'')+'>'+c[1]+'</label>';}).join('')+'</div></div>'+
  (P.age?'':'<p class="muted">Tip: add your age and health details in Profile to improve the report.</p>')+
  '<div class="bar-actions"><button class="btn ghost" data-act="back">Back</button><button class="btn" data-act="analyze">Get my report</button></div></div>';
}

function resultView(r){
  var u=URG[r.level],top=r.ranked[0],P=U().profile||{};
  var facts=['<span>'+r.sel.length+' symptoms</span>','<span>Duration: '+esc((DURS.filter(function(d){return d[0]===r.dur;})[0]||[0,'-'])[1].toLowerCase())+'</span>','<span>Severity: '+esc(r.sev)+'</span>'];
  if(r.temp!==null&&r.temp!==undefined)facts.push('<span>Temperature: '+r.temp+' °C</span>');
  if(r.age)facts.push('<span>Age: '+r.age+'</span>');
  if(r.bmi)facts.push('<span>BMI: '+r.bmi+'</span>');
  var why='';
  if(r.flags.length||r.reasons.length)why='<ul class="list" style="margin:8px 0 0">'+r.flags.concat(r.reasons).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  var html='<div class="page-head"><span class="eyebrow">Report</span><h1>Your symptom report</h1></div>'+
  '<div class="banner '+u.tone+'" role="status"><div class="ic"><span>'+u.icon+'</span></div><div class="bt"><b>'+u.title+'</b>'+u.text+why+'</div></div>'+
  '<div class="panel" style="margin-top:16px"><div class="sheet-head"><span class="eyebrow">Symptom match report · '+fmtDate(r.ts)+'</span></div><div class="facts" style="margin-bottom:18px">'+facts.join('')+'</div>';
  if(!top){
    html+='<h3>No clear match</h3><p class="muted" style="margin-top:8px">Your symptoms do not line up with any condition in this checker. A doctor can examine you and decide on tests.</p>';
  }else{
    var d=DIS[top.id];
    var missing=Object.keys(d.sym).filter(function(k){return r.sel.indexOf(k)<0;}).sort(function(a,b){return d.sym[b]-d.sym[a];}).slice(0,5);
    html+='<div class="top-match"><div><div class="big">'+top.pct+'<small>%</small></div><div class="muted" style="font-size:.82rem">symptom match</div></div>'+
    '<div><span class="area-ic" style="margin-bottom:10px">'+ico(DIS_ICON[top.id])+'</span><span class="eyebrow">Most likely match</span><h2 style="margin:4px 0 8px">'+esc(d.name)+'</h2><p>'+esc(d.desc)+'</p></div></div>'+
    '<div class="sub"><span class="lbl">Why it matched</span><div class="tags">'+top.matched.map(function(k){return '<span class="tag">'+esc(LBL[k])+'</span>';}).join('')+'</div></div>'+
    (missing.length?'<div class="sub"><span class="lbl">Typical signs you did not select</span><div class="tags">'+missing.map(function(k){return '<span class="tag miss">'+esc(LBL[k])+'</span>';}).join('')+'</div></div>':'')+
    '<div class="sub"><span class="lbl">What you can do</span><ul class="list">'+d.care.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul></div>'+
    '<div class="sub"><span class="lbl">Who to see</span><p>'+esc(d.doc)+'</p></div>';
    if(r.ranked.length>1){
      html+='<div class="sub"><span class="lbl">Other possibilities</span>'+r.ranked.slice(1).map(function(x){
        return '<div class="rank"><span>'+esc(DIS[x.id].name)+'</span><div class="bar" aria-hidden="true"><i style="width:'+x.pct+'%"></i></div><span class="pc">'+x.pct+'%</span></div>';
      }).join('')+'</div>';
    }
  }
  html+='<p class="disclaimer">The match score shows how closely your symptoms fit a condition. It is not a probability and not a diagnosis. Only a doctor can diagnose you. If you feel very unwell, do not wait for an online result.</p></div>'+
  '<div class="row" style="margin-top:16px">'+(S.fromHist?'<button class="btn" data-act="go" data-v="history">Back to history</button>':'<button class="btn" data-act="newcheck">New check</button>')+
  '<button class="btn ghost" data-act="copy">Copy report</button></div>'+
  (S.copyText?'<textarea class="copybox" id="copybox" readonly aria-label="Report text">'+esc(S.copyText)+'</textarea>':'');
  return html;
}

function reportText(r){
  var u=U(),L=['DISEASE PREDICTION - SYMPTOM REPORT',fmtDate(r.ts),'Name: '+(u.name||'Guest'),''];
  L.push('Symptoms: '+r.sel.map(function(k){return LBL[k];}).join(', '));
  L.push('Duration: '+(DURS.filter(function(d){return d[0]===r.dur;})[0]||[0,'-'])[1]+' | Severity: '+r.sev+(r.temp!=null?' | Temp: '+r.temp+' C':''));
  L.push('');L.push('Advice level: '+URG[r.level].title);
  r.flags.concat(r.reasons).forEach(function(x){L.push('- '+x);});
  L.push('');L.push('Possible matches:');
  r.ranked.forEach(function(x,i){L.push((i+1)+'. '+DIS[x.id].name+' - '+x.pct+'%');});
  if(r.ranked[0]){L.push('');L.push('Suggested steps:');DIS[r.ranked[0].id].care.forEach(function(c){L.push('- '+c);});L.push('See: '+DIS[r.ranked[0].id].doc);}
  L.push('');L.push('This report is information only and not a medical diagnosis.');
  return L.join('\n');
}

function historyView(){
  var h=U().history||[];
  var head='<div class="page-head"><span class="eyebrow">History</span><h1>Your past reports</h1><p class="muted">Saved in this browser for your account.</p></div>';
  if(!h.length)return head+'<div class="panel empty"><p>No reports yet.</p><p style="margin-top:12px"><button class="btn" data-act="go" data-v="check">Start a symptom check</button></p></div>';
  var items=h.map(function(r){
    var t=r.ranked[0],u=URG[r.level];
    var del=S.confirm===r.id?'<button class="btn danger sm" data-act="del-yes" data-v="'+r.id+'">Confirm delete</button><button class="btn ghost sm" data-act="del-no">Cancel</button>':'<button class="btn ghost sm" data-act="del" data-v="'+r.id+'">Delete</button>';
    return '<div class="panel hist-item"><div class="meta"><div class="eyebrow">'+fmtDate(r.ts)+'</div><h3 style="margin:4px 0">'+(t?esc(DIS[t.id].name):'No clear match')+'</h3><div class="row"><span class="mono">'+(t?t.pct+'%':'--')+'</span><span class="pill '+u.tone+'">'+esc(u.title)+'</span><span class="muted">'+r.sel.length+' symptoms</span></div></div><div class="row"><button class="btn sm" data-act="view-hist" data-v="'+r.id+'">View</button>'+del+'</div></div>';
  }).join('');
  var clear=S.confirm==='all'?'<button class="btn danger sm" data-act="del-yes" data-v="all">Confirm clear all</button> <button class="btn ghost sm" data-act="del-no">Cancel</button>':'<button class="btn ghost sm" data-act="del" data-v="all">Clear all history</button>';
  return head+'<div class="hist">'+items+'</div><div style="margin-top:18px">'+clear+'</div>';
}

function toolsView(){
  return '<div class="page-head"><span class="eyebrow">Health tools</span><h1>Quick health calculators</h1><p class="muted">Results update as you type. They show ranges, not diagnoses.</p></div>'+
  '<div class="cols">'+
  '<div class="panel" data-tool="bmi"><h3>Body mass index</h3><div class="grid2"><div class="field"><label for="t-h">Height (cm)</label><input id="t-h" type="number" min="50" max="250" placeholder="165"></div><div class="field"><label for="t-w">Weight (kg)</label><input id="t-w" type="number" min="10" max="300" placeholder="62"></div></div><div id="out-bmi" class="out"><span class="muted">Enter height and weight.</span></div></div>'+
  '<div class="panel" data-tool="bp"><h3>Blood pressure</h3><div class="grid2"><div class="field"><label for="t-sys">Systolic (top)</label><input id="t-sys" type="number" min="50" max="300" placeholder="120"></div><div class="field"><label for="t-dia">Diastolic (bottom)</label><input id="t-dia" type="number" min="30" max="200" placeholder="80"></div></div><div id="out-bp" class="out"><span class="muted">Enter both readings in mmHg.</span></div></div>'+
  '<div class="panel" data-tool="sugar"><h3>Blood sugar</h3><div class="grid2"><div class="field"><label for="t-stype">Reading taken</label><select id="t-stype"><option value="fast">Fasting (8 hours no food)</option><option value="post">2 hours after a meal</option></select></div><div class="field"><label for="t-sv">Value (mg/dL)</label><input id="t-sv" type="number" min="20" max="800" placeholder="95"></div></div><div id="out-sugar" class="out"><span class="muted">Enter your reading.</span></div></div>'+
  '</div>';
}
function outBox(tone,title,big,text){return '<div class="out '+tone+'"><b>'+title+'</b>'+(big?'<span class="v">'+big+'</span>':'')+(text?'<p style="margin-top:6px">'+text+'</p>':'')+'</div>';}
function bmiOut(h,w){
  var b=bmiCalc(h,w);
  if(!b)return '<div class="out"><span class="muted">Enter height and weight.</span></div>';
  return outBox(b.tone,(b.tone==='ok'?'✓ ':'! ')+b.cat,b.v,'Healthy weight for your height: '+b.lo+' to '+b.hi+' kg.'+(b.south?' For South Asians, health risk can begin from a BMI of 23.':''));
}
function bpOut(s,d){
  s=parseFloat(s);d=parseFloat(d);
  if(!(s>0)||!(d>0))return '<div class="out"><span class="muted">Enter both readings in mmHg.</span></div>';
  if(s<=d)return outBox('warn','Check the numbers','','The top number should be higher than the bottom number.');
  var big=Math.round(s)+'/'+Math.round(d);
  if(s>180||d>120)return outBox('crit','! Very high range',big,'Rest for five minutes and measure again. If it stays this high, or you have chest pain, headache or breathlessness, get emergency care.');
  if(s>=140||d>=90)return outBox('crit','! Stage 2 high range',big,'See a doctor soon for a proper check and treatment plan.');
  if(s>=130||d>=80)return outBox('warn','! Stage 1 high range',big,'Cut down salt, exercise and recheck on other days. Talk to a doctor if it stays here.');
  if(s>=120)return outBox('warn','! Elevated',big,'Slightly above ideal. Lifestyle changes help.');
  if(s<90||d<60)return outBox('warn','! Low range',big,'If you feel faint or dizzy, sit down, drink water and see a doctor.');
  return outBox('ok','✓ Normal range',big,'Keep up regular exercise and low salt food.');
}
function sugarOut(type,v){
  v=parseFloat(v);
  if(!(v>0))return '<div class="out"><span class="muted">Enter your reading.</span></div>';
  var big=Math.round(v)+' mg/dL';
  if(v<70)return outBox('warn','! Low range',big,'Take something sweet now if you feel shaky or sweaty, and speak to a doctor.');
  var lim=type==='fast'?[100,126]:[140,200];
  if(v<lim[0])return outBox('ok','✓ Normal range',big,'Within the usual range for this type of reading.');
  if(v<lim[1])return outBox('warn','! Prediabetes range',big,'Higher than normal. Ask your doctor for an HbA1c test and review diet and exercise.');
  return outBox('crit','! Diabetes range',big,'This reading is in the diabetes range. Only a doctor can confirm, so book a test soon.');
}

function profileView(){
  var u=U(),P=u.profile||{},cond=P.cond||[],b=bmiCalc(P.height,P.weight);
  return '<div class="page-head"><span class="eyebrow">Profile</span><h1>Your health profile</h1><p class="muted">Used to adjust your symptom reports.</p></div>'+
  '<form id="profform" class="panel"><h3>Basic details</h3><div class="grid2">'+
  '<div class="field"><label for="p-age">Age</label><input id="p-age" name="age" type="number" min="1" max="120" value="'+esc(P.age||'')+'"></div>'+
  '<div class="field"><label for="p-sex">Sex</label><select id="p-sex" name="sex"><option value="">Select</option><option value="female"'+(P.sex==='female'?' selected':'')+'>Female</option><option value="male"'+(P.sex==='male'?' selected':'')+'>Male</option><option value="other"'+(P.sex==='other'?' selected':'')+'>Other</option></select></div>'+
  '<div class="field"><label for="p-h">Height (cm)</label><input id="p-h" name="height" type="number" min="50" max="250" value="'+esc(P.height||'')+'"></div>'+
  '<div class="field"><label for="p-w">Weight (kg)</label><input id="p-w" name="weight" type="number" min="10" max="300" value="'+esc(P.weight||'')+'"></div></div>'+
  '<div id="bmiout" class="out'+(b?' '+b.tone:'')+'" style="margin:0 0 18px">'+(b?'<b>BMI '+b.v+' · '+esc(b.cat)+'</b>':'<span class="muted">BMI appears when you enter height and weight.</span>')+'</div>'+
  '<h3>Health background</h3><div class="checks" style="margin-bottom:14px">'+CONDS.map(function(c){return '<label class="check"><input type="checkbox" name="cond" value="'+c[0]+'"'+(cond.indexOf(c[0])>-1?' checked':'')+'>'+c[1]+'</label>';}).join('')+'<label class="check"><input type="checkbox" name="smoker"'+(P.smoker?' checked':'')+'>I smoke</label></div>'+
  '<button class="btn" type="submit">Save profile</button></form>'+
  '<div class="panel"><h3>Account</h3><p class="muted">'+esc(u.name||'Guest')+(S.user&&S.user!=='guest@local'?' · '+esc(S.user):'')+'</p></div>';
}

/* ---------- render ---------- */
function render(){$('#app').innerHTML=S.user?shell():authView();}
function go(v){
  if(v==='check'&&(S.step===3||S.fromHist))resetCheck();
  S.view=v;S.confirm=null;render();window.scrollTo(0,0);
}
function updSel(){
  var c=$('#selcount');if(c)c.textContent=S.sel.size;
  var n=$('#nextbtn');if(n)n.disabled=S.sel.size<2;
}
function setErr(m){
  var f=$('#authform');
  if(f){var fd=new FormData(f);S.draft={name:fd.get('name')||'',email:fd.get('email')||''};}
  S.err=m;render();
}
function login(email){S.user=email;lsSet('nalam_session',email);S.err='';S.draft={};S.view='home';resetCheck();render();window.scrollTo(0,0);}

async function doAuth(form){
  var fd=new FormData(form),mode=S.authMode;
  var email=String(fd.get('email')||'').trim().toLowerCase(),pw=String(fd.get('pw')||''),name=String(fd.get('name')||'').trim();
  var users=getUsers();
  S.draft={name:name,email:email};
  if(mode==='up'&&!name)return setErr('Enter your name.');
  if(!/^\S+@\S+\.\S+$/.test(email))return setErr('Enter a valid email address.');
  if(pw.length<6)return setErr('Password must have at least 6 characters.');
  if(mode==='up'){
    if(users[email])return setErr('An account with this email already exists. Sign in instead.');
    var salt=Math.random().toString(36).slice(2);
    users[email]={name:name,salt:salt,hash:await hashPw(pw,salt),profile:{},history:[]};
    lsSet('nalam_users',users);login(email);
  }else{
    var u=users[email];
    if(!u||!u.hash||u.hash!==await hashPw(pw,u.salt))return setErr('Email or password is incorrect.');
    login(email);
  }
}
function saveProfile(form){
  var fd=new FormData(form),u=U();
  var num=function(k,lo,hi){var v=parseFloat(fd.get(k));return (v>=lo&&v<=hi)?v:'';};
  u.profile={age:num('age',1,120),sex:fd.get('sex')||'',height:num('height',50,250),weight:num('weight',10,300),cond:fd.getAll('cond'),smoker:!!fd.get('smoker')};
  saveU(u);toast('Profile saved');render();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,v=t.dataset.v;
  switch(a){
    case 'auth-mode':S.authMode=v;S.err='';render();break;
    case 'guest':{
      var users=getUsers();
      if(!users['guest@local']){users['guest@local']={name:'Guest',salt:'',hash:null,profile:{},history:[]};lsSet('nalam_users',users);}
      login('guest@local');break;
    }
    case 'signout':S.user=null;lsSet('nalam_session','');S.authMode='in';render();window.scrollTo(0,0);break;
    case 'go':go(v);break;
    case 'sym':
      if(S.sel.has(v))S.sel.delete(v);else S.sel.add(v);
      t.setAttribute('aria-pressed',String(S.sel.has(v)));updSel();break;
    case 'clear-sel':S.sel=new Set();S.q='';render();break;
    case 'next':if(S.sel.size>=2){S.step=2;render();window.scrollTo(0,0);}break;
    case 'back':S.step=1;render();window.scrollTo(0,0);break;
    case 'dur':S.dur=parseFloat(v);Array.prototype.forEach.call(t.parentElement.children,function(b){b.setAttribute('aria-pressed',String(b===t));});break;
    case 'sev':S.sev=v;Array.prototype.forEach.call(t.parentElement.children,function(b){b.setAttribute('aria-pressed',String(b===t));});break;
    case 'analyze':{
      var res=analyze(),u=U();
      u.history=[res].concat(u.history||[]).slice(0,50);saveU(u);
      S.cur=res;S.step=3;S.fromHist=false;S.copyText='';render();window.scrollTo(0,0);break;
    }
    case 'newcheck':resetCheck();render();window.scrollTo(0,0);break;
    case 'view-hist':{
      var hit=(U().history||[]).filter(function(r){return r.id===v;})[0];
      if(hit){S.cur=hit;S.step=3;S.fromHist=true;S.view='check';S.copyText='';render();window.scrollTo(0,0);}
      break;
    }
    case 'del':S.confirm=v;render();break;
    case 'del-no':S.confirm=null;render();break;
    case 'del-yes':{
      var uu=U();
      uu.history=(v==='all')?[]:(uu.history||[]).filter(function(r){return r.id!==v;});
      saveU(uu);S.confirm=null;render();toast('Deleted');break;
    }
    case 'copy':{
      var txt=reportText(S.cur);
      var fallback=function(){S.copyText=txt;render();var b=$('#copybox');if(b){b.focus();b.select();}};
      try{navigator.clipboard.writeText(txt).then(function(){toast('Report copied');},fallback);}catch(err){fallback();}
      break;
    }
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==='authform')doAuth(f);
  else if(f.id==='profform')saveProfile(f);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.q=t.value;var c=$('#chips');if(c)c.innerHTML=chipsHTML();}
  else if(t.id==='temp'){S.temp=t.value;}
  else if(t.dataset&&t.dataset.ctx){S.ctx[t.dataset.ctx]=t.checked;}
  else if(t.closest&&t.closest('#profform')&&(t.id==='p-h'||t.id==='p-w')){
    var b=bmiCalc($('#p-h').value,$('#p-w').value),o=$('#bmiout');
    if(o){o.className='out'+(b?' '+b.tone:'');o.style.margin='0 0 18px';o.innerHTML=b?'<b>BMI '+b.v+' · '+esc(b.cat)+'</b>':'<span class="muted">BMI appears when you enter height and weight.</span>';}
  }
  else if(t.closest&&t.closest('[data-tool]')){
    var k=t.closest('[data-tool]').dataset.tool;
    if(k==='bmi')$('#out-bmi').outerHTML=bmiOut($('#t-h').value,$('#t-w').value).replace('class="out','id="out-bmi" class="out');
    if(k==='bp')$('#out-bp').outerHTML=bpOut($('#t-sys').value,$('#t-dia').value).replace('class="out','id="out-bp" class="out');
    if(k==='sugar')$('#out-sugar').outerHTML=sugarOut($('#t-stype').value,$('#t-sv').value).replace('class="out','id="out-sugar" class="out');
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='t-stype'){$('#out-sugar').outerHTML=sugarOut(t.value,$('#t-sv').value).replace('class="out','id="out-sugar" class="out');}
  if(t.dataset&&t.dataset.ctx){S.ctx[t.dataset.ctx]=t.checked;}
});

/* ---------- boot ---------- */
var ses=lsGet('nalam_session','');
if(ses&&getUsers()[ses])S.user=ses;
render();
})();
</script>
